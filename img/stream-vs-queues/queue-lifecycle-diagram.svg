<svg viewBox="0 0 900 380" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="900" height="380" fill="#0b1220" rx="12"/>
  <text x="450" y="40" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">A Queue Message Lives Once, Then It's Gone</text>

  <!-- Queue -->
  <rect x="40" y="90" width="150" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="115" y="135" fill="#e2e8f0" font-size="14" text-anchor="middle">Queue</text>
  <text x="115" y="155" fill="#94a3b8" font-size="11" text-anchor="middle">msg-4821</text>

  <path d="M190 130 L280 130" stroke="#7dd3fc" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="118" fill="#7dd3fc" font-size="11" text-anchor="middle">receive</text>

  <!-- Worker -->
  <rect x="280" y="90" width="160" height="80" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="360" y="125" fill="#e2e8f0" font-size="14" text-anchor="middle">Worker</text>
  <text x="360" y="145" fill="#fbbf24" font-size="11" text-anchor="middle">message hidden</text>
  <text x="360" y="160" fill="#94a3b8" font-size="11" text-anchor="middle">visibility timeout: 30s</text>

  <!-- success path -->
  <path d="M440 110 L560 70" stroke="#4ade80" stroke-width="2" marker-end="url(#arrowgreen)"/>
  <rect x="560" y="40" width="180" height="60" rx="8" fill="#052e16" stroke="#166534"/>
  <text x="650" y="65" fill="#4ade80" font-size="13" text-anchor="middle">success</text>
  <text x="650" y="83" fill="#86efac" font-size="11" text-anchor="middle">worker deletes message</text>

  <!-- failure path -->
  <path d="M440 150 L560 190" stroke="#f87171" stroke-width="2" marker-end="url(#arrowred)"/>
  <rect x="560" y="160" width="180" height="60" rx="8" fill="#450a0a" stroke="#7f1d1d"/>
  <text x="650" y="185" fill="#f87171" font-size="13" text-anchor="middle">crash / failure</text>
  <text x="650" y="203" fill="#fca5a5" font-size="11" text-anchor="middle">nothing deletes it</text>

  <!-- return to queue -->
  <path d="M650 220 C 650 260, 300 260, 115 170" stroke="#94a3b8" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#arrowgray)"/>
  <text x="380" y="270" fill="#94a3b8" font-size="12" text-anchor="middle">timeout expires → message reappears automatically, receive count +1</text>

  <!-- DLQ -->
  <path d="M760 190 L820 190" stroke="#f59e0b" stroke-width="2" marker-end="url(#arroworange)"/>
  <rect x="740" y="300" width="160" height="60" rx="8" fill="#1e293b" stroke="#334155"/>
  <path d="M650 220 L820 320" stroke="#f59e0b" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arroworange)"/>
  <text x="820" y="325" fill="#fbbf24" font-size="13" text-anchor="middle">after N retries</text>
  <text x="820" y="345" fill="#e2e8f0" font-size="12" text-anchor="middle">Dead-Letter Queue</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#7dd3fc"/></marker>
    <marker id="arrowgreen" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/></marker>
    <marker id="arrowred" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f87171"/></marker>
    <marker id="arrowgray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#94a3b8"/></marker>
    <marker id="arroworange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#f59e0b"/></marker>
  </defs>
</svg>
