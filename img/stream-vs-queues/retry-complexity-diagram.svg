<svg viewBox="0 0 940 420" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="420" fill="#0b1220" rx="12"/>
  <text x="470" y="36" fill="#e2e8f0" font-size="19" font-weight="700" text-anchor="middle">Getting to a Dead-Letter Queue: Built vs. Bolted-On</text>

  <!-- Kafka side -->
  <text x="235" y="70" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">Kafka (classic consumer group) — you build this</text>

  <rect x="40" y="90" width="120" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="100" y="117" fill="#e2e8f0" font-size="11" text-anchor="middle">payment.events</text>

  <path d="M160 113 L200 113" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>
  <rect x="200" y="90" width="110" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="255" y="112" fill="#e2e8f0" font-size="10" text-anchor="middle">retry-5s topic</text>
  <text x="255" y="126" fill="#64748b" font-size="9" text-anchor="middle">consumer sleeps/reschedules</text>

  <path d="M310 113 L350 113" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>
  <rect x="350" y="90" width="110" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="405" y="112" fill="#e2e8f0" font-size="10" text-anchor="middle">retry-1m topic</text>
  <text x="405" y="126" fill="#64748b" font-size="9" text-anchor="middle">custom backoff logic</text>

  <path d="M460 113 L500 113" stroke="#64748b" stroke-width="2" marker-end="url(#c1)"/>
  <rect x="500" y="90" width="110" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="555" y="112" fill="#e2e8f0" font-size="10" text-anchor="middle">retry-10m topic</text>
  <text x="555" y="126" fill="#64748b" font-size="9" text-anchor="middle">manual attempt counter</text>

  <path d="M610 113 L650 113" stroke="#f59e0b" stroke-width="2" marker-end="url(#c2)"/>
  <rect x="650" y="90" width="110" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="705" y="112" fill="#fbbf24" font-size="10" text-anchor="middle">DLQ topic</text>
  <text x="705" y="126" fill="#64748b" font-size="9" text-anchor="middle">app code decides "give up"</text>

  <text x="405" y="165" fill="#94a3b8" font-size="11" text-anchor="middle">Every arrow above is code you write and own: a producer, a consumer, a schema, and a schedule.</text>
  <text x="405" y="182" fill="#94a3b8" font-size="11" text-anchor="middle">One bad message can still stall the whole partition until someone manually skips its offset.</text>

  <line x1="40" y1="215" x2="900" y2="215" stroke="#1e293b" stroke-width="1"/>

  <!-- SQS side -->
  <text x="470" y="245" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">SQS — this is a config block</text>

  <rect x="80" y="265" width="160" height="50" rx="6" fill="#052e16" stroke="#166534"/>
  <text x="160" y="286" fill="#e2e8f0" font-size="11" text-anchor="middle">payment-retry-queue</text>
  <text x="160" y="302" fill="#86efac" font-size="9" text-anchor="middle">visibility timeout: 30s</text>

  <path d="M240 290 L340 290" stroke="#4ade80" stroke-width="2" marker-end="url(#c3)"/>
  <text x="290" y="278" fill="#4ade80" font-size="9" text-anchor="middle">fails 5x</text>

  <rect x="340" y="265" width="200" height="50" rx="6" fill="#052e16" stroke="#166534"/>
  <text x="440" y="286" fill="#e2e8f0" font-size="11" text-anchor="middle">RedrivePolicy</text>
  <text x="440" y="302" fill="#86efac" font-size="9" text-anchor="middle">maxReceiveCount: 5</text>

  <path d="M540 290 L640 290" stroke="#4ade80" stroke-width="2" marker-end="url(#c3)"/>

  <rect x="640" y="265" width="160" height="50" rx="6" fill="#052e16" stroke="#166534"/>
  <text x="720" y="286" fill="#e2e8f0" font-size="11" text-anchor="middle">DLQ</text>
  <text x="720" y="302" fill="#86efac" font-size="9" text-anchor="middle">automatic, no app code</text>

  <text x="470" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">Two fields on the queue's own config. No retry topics, no schedulers, no custom attempt-counting.</text>
  <text x="470" y="362" fill="#94a3b8" font-size="11" text-anchor="middle">One poison message is isolated to itself — every other message keeps flowing.</text>

  <defs>
    <marker id="c1" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#64748b"/></marker>
    <marker id="c2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#f59e0b"/></marker>
    <marker id="c3" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7 z" fill="#4ade80"/></marker>
  </defs>
</svg>
