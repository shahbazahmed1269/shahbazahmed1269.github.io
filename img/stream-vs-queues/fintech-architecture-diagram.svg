<svg viewBox="0 0 940 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="940" height="480" fill="#0b1220" rx="12"/>
  <text x="470" y="38" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">One Fintech System, Two Different Physics</text>

  <!-- payment service -->
  <rect x="380" y="65" width="180" height="55" rx="8" fill="#1e293b" stroke="#475569"/>
  <text x="470" y="98" fill="#e2e8f0" font-size="14" text-anchor="middle">Payment Service</text>

  <!-- stream side -->
  <rect x="60" y="150" width="380" height="30" fill="none"/>
  <text x="250" y="165" fill="#4ade80" font-size="14" font-weight="700" text-anchor="middle">STREAM — payment.events (Kafka)</text>
  <rect x="60" y="180" width="380" height="46" rx="6" fill="#052e16" stroke="#166534"/>
  <text x="250" y="208" fill="#86efac" font-size="12" text-anchor="middle">retained, ordered, replayable</text>

  <path d="M400 120 L250 178" stroke="#4ade80" stroke-width="2" marker-end="url(#b1)"/>

  <g>
    <path d="M110 226 L110 260" stroke="#334155" stroke-width="2" marker-end="url(#b2)"/>
    <path d="M250 226 L250 260" stroke="#334155" stroke-width="2" marker-end="url(#b2)"/>
    <path d="M390 226 L390 260" stroke="#334155" stroke-width="2" marker-end="url(#b2)"/>
  </g>

  <rect x="40" y="260" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="110" y="283" fill="#e2e8f0" font-size="12" text-anchor="middle">Ledger Service</text>
  <text x="110" y="300" fill="#64748b" font-size="10" text-anchor="middle">consumer group A</text>

  <rect x="180" y="260" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="250" y="283" fill="#e2e8f0" font-size="12" text-anchor="middle">Fraud Scoring</text>
  <text x="250" y="300" fill="#64748b" font-size="10" text-anchor="middle">consumer group B</text>

  <rect x="320" y="260" width="140" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="390" y="283" fill="#e2e8f0" font-size="12" text-anchor="middle">Analytics / DWH</text>
  <text x="390" y="300" fill="#64748b" font-size="10" text-anchor="middle">consumer group C, replayed nightly</text>

  <text x="250" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">Three independent readers, same events, none of them delete anything.</text>

  <!-- queue side -->
  <text x="700" y="165" fill="#fbbf24" font-size="14" font-weight="700" text-anchor="middle">QUEUE — SQS / job tables</text>
  <rect x="520" y="180" width="360" height="46" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="700" y="208" fill="#e2e8f0" font-size="12" text-anchor="middle">one job, one worker, delete on success</text>

  <path d="M540 120 L700 178" stroke="#fbbf24" stroke-width="2" marker-end="url(#b3)"/>

  <path d="M600 226 L600 260" stroke="#334155" stroke-width="2" marker-end="url(#b2)"/>
  <path d="M800 226 L800 260" stroke="#334155" stroke-width="2" marker-end="url(#b2)"/>

  <rect x="520" y="260" width="160" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="600" y="283" fill="#e2e8f0" font-size="12" text-anchor="middle">Payment Retry Worker</text>
  <text x="600" y="300" fill="#64748b" font-size="10" text-anchor="middle">DLQ after 5 attempts</text>

  <rect x="720" y="260" width="160" height="55" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="800" y="283" fill="#e2e8f0" font-size="12" text-anchor="middle">Webhook Delivery</text>
  <text x="800" y="300" fill="#64748b" font-size="10" text-anchor="middle">visibility timeout retry</text>

  <text x="700" y="345" fill="#94a3b8" font-size="11" text-anchor="middle">Each job runs exactly once, gets deleted, or dies into a DLQ for a human to look at.</text>

  <line x1="470" y1="380" x2="470" y2="410" stroke="#334155" stroke-dasharray="4 3"/>
  <text x="470" y="435" fill="#64748b" font-size="12" text-anchor="middle">Same payment event, two different jobs to do — a fan-out read and a run-once task.</text>

  <defs>
    <marker id="b1" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#4ade80"/></marker>
    <marker id="b2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#475569"/></marker>
    <marker id="b3" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#fbbf24"/></marker>
  </defs>
</svg>
